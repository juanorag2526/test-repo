<style>html,body{margin:0;height:100%;background:#0A0908}
/* ===== Deck (shared with the downloaded file) ===== */
.jr-deck { position: relative; width: 1920px; height: 1080px; font-family: "DM Sans", Arial, sans-serif; }

.jr-deck.static .slide { opacity: 1; visibility: visible; transition: none; }
.jr-deck .dark { background: #121110; color: #F5F2EC; }

.jr-deck .display { font-family: "Michroma", Arial, sans-serif; font-weight: 400; text-transform: uppercase; line-height: 1.15; letter-spacing: 4px; }
.jr-deck .lead { font-size: 44px; line-height: 1.25; font-weight: 500; }
.jr-deck .dark .soft { color: #B8B0A4; } .jr-deck .light .soft { color: #5B554D; }

.jr-deck .tag { font-family: "Oswald", Arial, sans-serif; font-weight: 500; font-size: 28px; letter-spacing: 4px; text-transform: uppercase; padding: 20px 44px; display: inline-block; }
.jr-deck .dark .tag { border: 2px solid #F5F2EC; } .jr-deck .light .tag { border: 2px solid #161513; }

.jr-deck .statement { font-size: 60px; line-height: 1.2; font-weight: 500; max-width: 1500px; margin-top: auto; }
.jr-deck .cols { display: flex; gap: 48px; margin-top: auto; }
.jr-deck .col { flex: 1; min-width: 0; padding-top: 32px; display: flex; flex-direction: column; gap: 20px; }
.jr-deck .light .col { border-top: 4px solid #161513; } .jr-deck .dark .col { border-top: 4px solid #F5F2EC; }

.jr-deck .light .col .num { color: #8F5414; } .jr-deck .dark .col .num { color: #E2A85B; }

.jr-deck .light .stp { background: #161513; color: #F5F2EC; } .jr-deck .dark .stp { background: #1E1B18; color: #F5F2EC; border: 2px solid rgba(245,242,236,.16); }
.jr-deck .stp.top { background: #E2A85B !important; color: #161513 !important; border-color: #E2A85B !important; }

.jr-deck .stp h3 { font-family: "Oswald", Arial, sans-serif; font-weight: 600; font-size: 40px; letter-spacing: 3px; text-transform: uppercase; line-height: 1.15; }
.jr-deck .stp p.t { font-size: 30px; line-height: 1.35; opacity: .82; }
.jr-deck .flow { position: relative; width: 1664px; height: 260px; margin-top: auto; }

.jr-deck .dark .node { border: 2px solid rgba(245,242,236,.3); } .jr-deck .light .node { border: 2px solid #161513; }

@keyframes jr-rise { from { opacity: 0; transform: translateY(40px); } }
@keyframes jr-blur { from { opacity: 0; filter: blur(18px); transform: translateY(24px); } }
@keyframes jr-grow { from { opacity: 0; transform: translateY(160px); } }
@keyframes jr-fade { from { opacity: 0; } }
.jr-deck .slide.on .a { animation: jr-rise .8s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 140ms); }
.jr-deck .slide.on .b { animation: jr-blur 1.1s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 160ms); }
.jr-deck .slide.on .g { animation: jr-grow .9s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 180ms); }

/* ===== Player ===== */

.jr-player .jr-bar { position: absolute; z-index: 10; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 4px; padding: 6px; background: rgba(18,17,16,.8); border: 1px solid rgba(245,242,236,.16); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); transition: opacity .35s ease, transform .35s ease; flex-wrap: wrap; max-width: calc(100% - 32px); }

.jr-player .jr-notes .meta { font-family: "Oswald", Arial, sans-serif; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #E2A85B; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 12px; }
.jr-player .jr-notes .nx { margin-top: 12px; font-size: 14px; color: #B8B0A4; }
.jr-player .jr-blank { position: absolute; inset: 0; background: #000; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .4s; }
.jr-player .jr-blank.on { opacity: 1; pointer-events: auto; }

<!-- Motor de la versión en vivo. No editar: solo se cambia el bloque DATOS de abajo. -->
<script>
(function () {
  var E = {};
  var PART = {
    dark: { n: 110, d: 170, line: '226,168,91', la: .35, dot: 'rgba(245,242,236,.75)', v: .45 },
    soft: { n: 70, d: 150, line: '226,168,91', la: .22, dot: 'rgba(245,242,236,.45)', v: .3 },
    light: { n: 110, d: 170, line: '143,84,20', la: .3, dot: 'rgba(22,21,19,.5)', v: .45 },
    lightsoft: { n: 70, d: 150, line: '143,84,20', la: .2, dot: 'rgba(22,21,19,.35)', v: .3 }
  };
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null && text !== '') e.textContent = String(text); return e; }
  function str(v, max) { v = v == null ? '' : String(v).trim(); return max && v.length > max ? v.slice(0, max - 1).trim() + '…' : v; }
  function anim(e, kind, i) { e.classList.add(kind); e.style.setProperty('--i', i); return e; }
  function pick(len, steps) { for (var k = 0; k < steps.length; k++) if (len <= steps[k][0]) return steps[k][1]; return steps[steps.length - 1][1]; }
  function longestWord(s) { return String(s).split(/\s+/).reduce(function (m, w) { return Math.max(m, w.length); }, 0); }
  function displaySize(text, base) {
    var t = String(text), len = t.length, w = longestWord(t);
    var size = pick(len, base);
    var maxByWord = Math.floor(1664 / (w * 0.98 + 0.1));
    return Math.max(44, Math.min(size, maxByWord));
  }
  function tone(style, i, layout) {
    if (style === 'oscuro') return 'dark';
    if (style === 'claro') return 'light';
    return i % 2 === 0 ? 'dark' : 'light';
  }
  function head(sec, s, startI) {
    var h = el('div', 'head');
    if (s.eyebrow) h.appendChild(anim(el('p', 'eyebrow', str(s.eyebrow, 40)), 'a', startI));
    if (s.title) { var t = el('h2', 'display', str(s.title, 60)); t.style.fontSize = displaySize(t.textContent, [[14, 88], [22, 72], [32, 58], [999, 48]]) + 'px'; h.appendChild(anim(t, 'a', startI + 1)); }
    if (s.text) { var p = el('p', 'soft', str(s.text, 160)); p.style.fontSize = '32px'; p.style.maxWidth = '1400px'; h.appendChild(anim(p, 'a', startI + 2)); }
    sec.appendChild(h);
  }
  function foot(sec, data, i) {
    var f = el('div', 'foot'); f.appendChild(el('p', '', data.speaker || '')); f.appendChild(el('p', '', String(i + 1))); sec.appendChild(f);
  }
  function items(s, min, max) { var a = Array.isArray(s.items) ? s.items.filter(function (x) { return x && (x.title || x.text); }) : []; return a.slice(0, max); }
  function numParts(v) {
    var m = /^\s*([0-9]+(?:[.,][0-9]+)?)\s*$/.exec(String(v == null ? '' : v));
    if (!m) return null;
    var raw = m[1], dec = raw.indexOf(',') >= 0 ? ',' : '.', n = parseFloat(raw.replace(',', '.'));
    var places = raw.indexOf(dec) >= 0 ? raw.split(dec)[1].length : 0;
    return { n: n, places: places, dec: dec };
  }
  function fmtNum(x, p) {
    var s = x.toFixed(p.places);
    var parts = s.split('.'), int = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, p.dec === ',' ? '.' : ' ');
    return parts.length > 1 ? int + p.dec + parts[1] : int;
  }

  var B = {};
  B.cover = function (sec, s, data, closing) {
    sec.classList.add('cover');
    sec.appendChild(el('canvas', 'particles')).dataset.p = sec.classList.contains('dark') ? 'dark' : 'light';
    if (s.eyebrow) sec.appendChild(anim(el('p', 'eyebrow', str(s.eyebrow, 40)), 'b', 0));
    var h = el('h1', 'display', str(s.title || data.title, 60)); h.style.fontSize = displaySize(h.textContent, [[16, 112], [28, 96], [40, 76], [999, 60]]) + 'px'; h.style.marginTop = '40px'; h.style.maxWidth = '1664px';
    sec.appendChild(anim(h, 'b', 1));
    if (s.subtitle) { var p = el('p', 'lead soft', str(s.subtitle, 120)); p.style.marginTop = '40px'; p.style.fontWeight = '400'; p.style.maxWidth = '1400px'; sec.appendChild(anim(p, 'b', 3)); }
    if (s.tag) { var t = el('p', 'tag', str(s.tag, 60)); t.style.marginTop = '56px'; sec.appendChild(anim(t, 'b', 5)); }
    if (data.speaker) { var g = el('p', 'signature', data.speaker); g.style.marginTop = '48px'; sec.appendChild(anim(g, 'b', 6)); }
  };
  B.closing = function (sec, s, data) { B.cover(sec, s, data, true); };
  B.statement = function (sec, s, data, i) {
    var t = Object.assign({}, s, { text: '' }); head(sec, t, 0);
    if (s.text) { var p = el('p', 'statement', str(s.text, 140)); sec.appendChild(anim(p, 'a', 3)); }
  };
  B.cards = function (sec, s, data, i) {
    head(sec, { eyebrow: s.eyebrow, title: s.title }, 0);
    var list = items(s, 2, 4), row = el('div', 'cols');
    list.forEach(function (it, k) {
      var c = anim(el('div', 'col'), 'a', 3 + k);
      c.appendChild(el('p', 'num', (k < 9 ? '0' : '') + (k + 1)));
      if (it.title) { var h = el('h3', '', str(it.title, 40)); h.style.fontSize = (list.length > 3 ? 38 : 44) + 'px'; c.appendChild(h); }
      if (it.text) c.appendChild(el('p', 't soft', str(it.text, 100)));
      row.appendChild(c);
    });
    sec.appendChild(row);
  };
  B.steps = function (sec, s, data, i) {
    head(sec, { eyebrow: s.eyebrow, title: s.title }, 0);
    var list = items(s, 3, 4), row = el('div', 'stairs'), k = list.length;
    var lo = k > 3 ? 300 : 340, hi = 600, stepH = k > 1 ? (hi - lo) / (k - 1) : 0;
    list.forEach(function (it, j) {
      var c = anim(el('div', 'stp' + (j === k - 1 ? ' top' : '')), 'g', 2 + j);
      c.style.height = Math.round(lo + stepH * j) + 'px';
      c.appendChild(el('p', 'num', (j < 9 ? '0' : '') + (j + 1)));
      if (it.title) c.appendChild(el('h3', '', str(it.title, 30)));
      if (it.text) c.appendChild(el('p', 't', str(it.text, 80)));
      row.appendChild(c);
    });
    sec.appendChild(row);
  };
  B.flow = function (sec, s, data, i) {
    head(sec, s, 0);
    var list = items(s, 3, 5), k = Math.max(1, list.length), gap = 96, w = Math.floor((1664 - gap * (k - 1)) / k);
    var box = el('div', 'flow');
    var dark = sec.classList.contains('dark'), col = dark ? '#E2A85B' : '#8F5414';
    var NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('width', '1664'); svg.setAttribute('height', '260'); svg.setAttribute('viewBox', '0 0 1664 260'); svg.setAttribute('aria-hidden', 'true');
    svg.style.left = '0'; svg.style.top = '0'; anim(svg, 'f', 3);
    for (var j = 0; j < k - 1; j++) {
      var x = (j + 1) * w + j * gap;
      var ln = document.createElementNS(NS, 'path'); ln.setAttribute('d', 'M' + x + ' 130 L' + (x + gap) + ' 130');
      ln.setAttribute('stroke', col); ln.setAttribute('stroke-width', '2'); ln.setAttribute('stroke-dasharray', '6 8'); ln.setAttribute('stroke-opacity', '.6'); svg.appendChild(ln);
      var c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', x); c.setAttribute('cy', '130'); c.setAttribute('r', '7'); c.setAttribute('fill', col);
      if (!reduce) { var m = document.createElementNS(NS, 'animateMotion'); m.setAttribute('dur', '1.4s'); m.setAttribute('begin', (1 + j * 0.3) + 's'); m.setAttribute('repeatCount', 'indefinite'); m.setAttribute('path', 'M0 0 L' + gap + ' 0'); c.appendChild(m); }
      svg.appendChild(c);
    }
    box.appendChild(svg);
    list.forEach(function (it, j) {
      var nd = anim(el('div', 'node' + (j === k - 1 ? ' end' : '')), 'a', 3 + j);
      nd.style.left = (j * (w + gap)) + 'px'; nd.style.width = w + 'px';
      nd.appendChild(el('p', 'k', 'Paso ' + (j + 1)));
      var p = el('p', '', str(it.title || it.text, 40)); p.style.fontSize = (w < 300 ? 28 : 34) + 'px'; nd.appendChild(p);
      box.appendChild(nd);
    });
    sec.appendChild(box);
  };
  B.number = function (sec, s, data, i) {
    sec.classList.add('center');
    sec.appendChild(el('canvas', 'particles')).dataset.p = sec.classList.contains('dark') ? 'soft' : 'lightsoft';
    if (s.eyebrow) sec.appendChild(anim(el('p', 'eyebrow', str(s.eyebrow, 40)), 'a', 0));
    var parts = numParts(s.value), suf = str(s.suffix, 6);
    var n = el('p', 'n big', (s.value == null ? '' : String(s.value)) + suf);
    var len = n.textContent.length; n.style.fontSize = (len <= 4 ? 220 : len <= 6 ? 180 : len <= 9 ? 140 : 100) + 'px'; n.style.marginTop = '24px';
    if (parts) { n.dataset.to = parts.n; n.dataset.places = parts.places; n.dataset.dec = parts.dec; n.dataset.suffix = suf; }
    sec.appendChild(n);
    if (s.label) { var l = el('p', 'lead', str(s.label, 110)); l.style.marginTop = '24px'; l.style.maxWidth = '1400px'; sec.appendChild(anim(l, 'a', 4)); }
    if (s.source) sec.appendChild(anim(el('p', 'src soft', 'Fuente: ' + str(s.source, 80)), 'a', 6));
  };
  B.quote = function (sec, s, data, i) {
    sec.classList.add('center');
    if (s.eyebrow) sec.appendChild(anim(el('p', 'eyebrow', str(s.eyebrow, 40)), 'a', 0));
    var q = el('p', 'qt', '«' + str(s.text, 160).replace(/^[«"“]|[»"”]$/g, '') + '»'); q.style.marginTop = '32px';
    if (q.textContent.length > 90) q.style.fontSize = '60px';
    sec.appendChild(anim(q, 'b', 1));
    if (s.source) { var a = el('p', 'signature soft', str(s.source, 60)); a.style.marginTop = '40px'; sec.appendChild(anim(a, 'a', 4)); }
  };

  E.render = function (data) {
    var slides = (data && Array.isArray(data.slides)) ? data.slides : [];

      B[layout](sec, s, data, i);

    });
  };

  function drawField(f, move) {
